[workspace]
resolver = "3"
members = ["crates/*"]
# `cargo build` / `cargo test` from the root never touch the Python binding.
# This enforces the core rule: the CAD core builds and tests without Python.
default-members = [
    "crates/arq-geometry",
    "crates/arq-kernel",
    "crates/arq-document",
    "crates/arq-core",
    "crates/arq-render",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/3djlchb/arqstudiocad"
authors = ["ArqStudioCAD contributors"]
publish = false

[workspace.dependencies]
arq-geometry = { path = "crates/arq-geometry" }
arq-kernel = { path = "crates/arq-kernel" }
arq-document = { path = "crates/arq-document" }
arq-core = { path = "crates/arq-core" }
arq-render = { path = "crates/arq-render" }
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12", "gles", "metal", "std", "vulkan", "wgsl"] }
pollster = "=0.4.0"
pyo3 = "0.29.3"
# DWG/DXF engine (ADR 0017): AcadRust from crates.io, pinned to the exact version
# measured. Upgrade only deliberately, after the round-trip corpus and
# tools/dwg-bench pass, and record it in ADR 0017's log.
acadrust = "=0.6.7"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
# AcadRust after 0.6.5 (the original's 2b12197) with our changes, kept in
# our fork (ADR 0017 D2): class objects that fail to decode kept verbatim;
# inline surfaces' binary extra modeler block; TOLERANCE text and box in
# DXF; R11/R12 current layer, style and linetype names (the original now
# writes DXF hatch elliptic edge angles in degrees itself). Branch
# arqstudiocad/on-c5555a5 of our fork, on the original's c5555a5 (0.6.7);
# THIRD_PARTY.md lists them.
acadrust = { git = "https://github.com/3djlchb/acadrust", rev = "955bdd8e68d554be1db681541bd1e53140a79ebc" }
