[package]
name = "arq-core"
description = "ArqStudioCAD core facade: operations, transactions, history and queries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
arq-geometry.workspace = true
arq-document.workspace = true

[dev-dependencies]
arq-document = { workspace = true, features = ["test-support"] }
tempfile = "3"
# Statistics without plotting dependencies.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "query"
harness = false

[lints]
workspace = true
