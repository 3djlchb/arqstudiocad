[package]
name = "arq-render"
description = "ArqStudioCAD render scene: derived graphics data, independent of Qt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
arq-core.workspace = true
arq-geometry.workspace = true
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
wgpu.workspace = true
pollster.workspace = true

[lints]
workspace = true

[dev-dependencies]
arq-document = { workspace = true, features = ["test-support"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "raster"
harness = false
