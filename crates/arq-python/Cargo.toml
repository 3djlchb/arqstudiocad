[package]
name = "arq-python"
description = "ArqStudioCAD Python bindings (PyO3), built with maturin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
arq-core.workspace = true
# abi3: one wheel per platform works on every Python >= 3.12.
pyo3 = { workspace = true, features = ["abi3-py312"] }

# Not inheriting workspace lints: PyO3 macros expand to `unsafe` code.
[lints.clippy]
all = { level = "warn", priority = -1 }
