name: Something goes wrong / Algo falla
description: A crash, a command that misbehaves, a window that will not open.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "**Escribe en español si prefieres** — English or Spanish, both are read."
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what happened, and what you expected instead.
      placeholder: |
        I type TR, pick a cutting edge, click the piece to remove, and the
        whole line disappears instead of the piece.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Step by step
      description: The shortest sequence that shows it, starting from a new drawing.
      placeholder: |
        1. New drawing
        2. L, two points, Enter
        3. …
  - type: input
    id: version
    attributes:
      label: ArqStudioCAD version or commit
      placeholder: 0.1.0, or the commit hash if built from source
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows x86-64
        - Windows ARM64
        - macOS Apple Silicon
        - macOS Intel
        - Linux
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System details
      description: OS version; on Linux the distribution and whether the session is Wayland or X11.
      placeholder: Windows 11 24H2 / LMDE 7, X11
  - type: input
    id: gpu
    attributes:
      label: Graphics card and backend (if it is a drawing/display problem)
      description: The GPU, and the graphics backend shown in Help ▸ About once available.
      placeholder: NVIDIA GT 730, OpenGL ES 3.0
  - type: textarea
    id: terminal
    attributes:
      label: Terminal output, if you have it
      description: If it crashed and you started it from a terminal, paste what it printed.
      render: shell
