name: Packages

# Manual only (ADR 0005). Builds every package with the same scripts used
# locally, self-checks each one, and uploads them as workflow artifacts. Not
# a release: nothing is published (ADR 0003).
on:
  workflow_dispatch:

# Least privilege (ADR 0037): the token only reads the repository. Actions
# are pinned to a commit, with the release in a comment; Dependabot keeps
# them current (.github/dependabot.yml).
permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Build installer and portable ZIP
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 14
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev rpm desktop-file-utils appstream
      - name: Build AppImage, .deb, .rpm and tarball
        run: bash packaging/linux/build.sh
      - name: Install and self-check in clean distributions
        run: bash packaging/linux/test-packages.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/linux/*.AppImage
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/linux/*.tar.gz
          retention-days: 14
          if-no-files-found: error

  macos:
    name: macOS universal2
    runs-on: macos-15
    env:
      PYTHON_VERSION: "3.13.16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Universal2 Python from python.org
        run: |
          curl -fsSL -o python.pkg \
            "https://www.python.org/ftp/python/${PYTHON_VERSION}/python-${PYTHON_VERSION}-macos11.pkg"
          sudo installer -pkg python.pkg -target /
      - name: Rosetta (to self-check the Intel half)
        run: softwareupdate --install-rosetta --agree-to-license || true
      - name: Build .app and .dmg
        run: bash packaging/macos/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: macos-universal2
          path: dist/macos/*.dmg
          retention-days: 14
          if-no-files-found: error
