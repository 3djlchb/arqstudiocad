name: CI

# Every pull request to main and every push to main, on every platform, and by
# hand (ADR 0014, amending ADR 0005). It adds platforms not available locally
# (macOS, Windows ARM); it does not replace the local checks (AGENTS.md).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner images are pinned (not *-latest) so an image migration never changes
# results silently; they are bumped deliberately, like the Rust toolchain.
env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # rustup installs the exact toolchain from rust-toolchain.toml.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy with test helpers enabled
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test core crates (no Python)
        run: cargo test
      # Round-trip corpus, source 2 (ADR 0011, D3.12): the codec's sample
      # drawings, downloaded and checksummed. Source 1 runs in `cargo test`;
      # source 3 (real drawings) is local only and never reaches CI.
      - uses: astral-sh/setup-uv@v10.3.0  # no major-version tag is published
      - name: Fetch the codec's sample drawings
        run: uv run --no-project --python 3.13 tools/fetch_codec_samples.py
      - name: Round-trip corpus (codec samples)
        run: cargo test -p arq-core --test corpus -- --ignored codec
      - name: Core crates must not depend on Python
        shell: bash
        run: |
          for crate in arq-geometry arq-document arq-core arq-render; do
            if cargo tree -p "$crate" -e normal,build --prefix none | grep -q '^pyo3'; then
              echo "::error::$crate depends on pyo3"; exit 1
            fi
          done

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        # Minimum supported (3.12), the version bundled in every package
        # (3.13, ADR 0009) and the newest (3.14).
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: System libraries Qt needs, even offscreen (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libglib2.0-0t64
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.0  # no major-version tag is published
        with:
          python-version: ${{ matrix.python }}
      - name: Build extension and dev environment
        run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run stubtest arqstudiocad._core
      # Regression drawings some tests read (ADR 0017 D5.4); required here.
      - name: Fetch the sample and regression drawings
        run: uv run python tools/fetch_codec_samples.py
      - run: uv run pytest --junitxml=pytest-results.xml
        env:
          ARQ_REQUIRE_SAMPLES: "1"
      # The log is private but annotations are public: one per failed test,
      # so an intermittent failure can be identified from the pull request.
      - name: Failed tests as annotations
        if: failure()
        run: uv run python tools/ci_test_annotations.py pytest-results.xml

  cargo-deny:
    name: Licenses and advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
